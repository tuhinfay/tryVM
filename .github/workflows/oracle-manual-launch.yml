name: Oracle VM Manual Launch

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  launch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install OCI SDK
        run: python -m pip install --upgrade pip oci
      - name: Launch Oracle VM
        env:
          OCI_REGION: ap-singapore-1
          OCI_TENANCY: ${{ secrets.OCI_TENANCY }}
          OCI_USER: ${{ secrets.OCI_USER }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
          OCI_SUBNET: ${{ secrets.OCI_SUBNET }}
          OCI_IMAGE: ${{ secrets.OCI_IMAGE }}
          OCI_SSH_KEY: ${{ secrets.OCI_SSH_KEY }}
          OCI_AD: FqdA:AP-SINGAPORE-1-AD-1
          VM_NAME: Tuhinpc-Final-VM
        run: |
          set +e
          for i in 1 2 3 4 5; do
            echo "===== Oracle VM attempt $i/5 ====="
            python launch_vm.py
            rc=$?
            if [ "$rc" -eq 0 ]; then exit 0; fi
            if [ "$rc" -eq 2 ] && [ "$i" -lt 5 ]; then
              sleep 45
              continue
            fi
            exit "$rc"
          done
