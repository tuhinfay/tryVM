name: Oracle VM Auto Retry

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0,2,4,6,8,10,12,14,16 * * *"
    - cron: "0 18,19,20,21,22,23 * * *"

concurrency:
  group: oracle-vm-launch
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  launch:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install OCI SDK
        run: |
          python -m pip install --upgrade pip
          python -m pip install oci

      - name: Oracle VM Auto Retry
        id: vm
        env:
          OCI_REGION: ap-singapore-1
          OCI_TENANCY: ${{ secrets.OCI_TENANCY }}
          OCI_USER: ${{ secrets.OCI_USER }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
          OCI_SUBNET: ${{ secrets.OCI_SUBNET }}
          OCI_IMAGE: ${{ secrets.OCI_IMAGE }}
          OCI_SSH_KEY: ${{ secrets.OCI_SSH_KEY }}
          OCI_AD: "FqdA:AP-SINGAPORE-1-AD-1"
          VM_NAME: "Tuhinpc-Final-VM"
        shell: bash
        run: |
          set +e

          MAX_ATTEMPTS=30
          NORMAL_WAIT_MIN=100
          NORMAL_WAIT_MAX=120
          RATE_LIMIT_COOLDOWN=180
          attempts=0
          event=""

          echo ""
          echo "╔══════════════════════════════════════════════════════╗"
          echo "║        Oracle VM Auto Retry                         ║"
          echo "║        VM: Tuhinpc-Final-VM                         ║"
          echo "║        A1 Flex | 1 OCPU | 1 GB | Singapore         ║"
          echo "╚══════════════════════════════════════════════════════╝"
          echo ""
          echo "Maximum attempts : $MAX_ATTEMPTS"
          echo "Normal wait      : ${NORMAL_WAIT_MIN}-${NORMAL_WAIT_MAX}s (random jitter)"
          echo "429 cooldown     : ${RATE_LIMIT_COOLDOWN}s"
          echo "Starting VM capacity check..."
          echo ""

          for i in $(seq 1 "$MAX_ATTEMPTS"); do
            attempts=$i

            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "🔎 ATTEMPT $i/$MAX_ATTEMPTS"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "⏱️  Checking Oracle A1 Flex capacity..."

            python launch_vm.py > vm-result.txt 2>&1
            rc=$?

            cat vm-result.txt
            event=$(grep -E '^(SUCCESS|VM_EXISTS|CAPACITY_UNAVAILABLE|OCI_ERROR)' vm-result.txt | tail -1 || true)

            if [ "$rc" -eq 0 ]; then
              echo ""
              echo "🟢 SUCCESS"
              echo "VM operation completed successfully."
              echo "Total attempts: $attempts"
              echo "Total retries: $((attempts - 1))"
              echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
              break
            fi

            if [ "$event" = "CAPACITY_UNAVAILABLE" ]; then
              echo ""
              echo "🔴 Capacity not available."
              echo "Attempt: $i/$MAX_ATTEMPTS"
              echo "Retries used: $((i - 1))"
              echo "Retries remaining: $((MAX_ATTEMPTS - i))"

              if [ "$i" -lt "$MAX_ATTEMPTS" ]; then
                WAIT_SECONDS=$(( NORMAL_WAIT_MIN + RANDOM % (NORMAL_WAIT_MAX - NORMAL_WAIT_MIN + 1) ))
                echo "⏳ Next attempt in ${WAIT_SECONDS}s (random jitter)..."
                echo ""
                sleep "$WAIT_SECONDS"
              else
                echo ""
                echo "⚠️  All $MAX_ATTEMPTS attempts completed."
                echo "❌ Oracle A1 Flex capacity was not available."
                echo "Total retries: $((MAX_ATTEMPTS - 1))"
              fi

              continue
            fi

            if [[ "$event" == OCI_ERROR\|* ]] && grep -qiE '429|TooManyRequests|too many requests|throttl' vm-result.txt; then
              echo ""
              echo "🟠 Oracle rate limit detected (HTTP 429 / TooManyRequests)."
              echo "Attempt: $i/$MAX_ATTEMPTS"
              echo "Retries used: $((i - 1))"
              echo "⏸️  Cooling down for ${RATE_LIMIT_COOLDOWN}s before the next attempt..."

              if [ "$i" -lt "$MAX_ATTEMPTS" ]; then
                sleep "$RATE_LIMIT_COOLDOWN"
                continue
              fi
            fi

            echo ""
            echo "🔴 OCI/API error detected."
            echo "Stopping retries because this is not a capacity error."
            echo "Attempts completed: $attempts"
            break
          done

          echo "event=$event" >> "$GITHUB_OUTPUT"
          echo "attempts=$attempts" >> "$GITHUB_OUTPUT"

          echo ""
          echo "════════════════ FINAL RESULT ════════════════"

          if [[ "$event" == SUCCESS\|* ]]; then
            echo "🟢 VM LAUNCH SUCCESSFUL"
            echo "Attempts: $attempts"
            echo "Retries: $((attempts - 1))"
            exit 0
          fi

          if [ "$event" = "VM_EXISTS" ]; then
            echo "🟢 VM ALREADY EXISTS"
            echo "No new VM was created."
            exit 0
          fi

          if [ "$event" = "CAPACITY_UNAVAILABLE" ]; then
            echo "🟡 NO CAPACITY FOUND"
            echo "Attempts: $attempts/$MAX_ATTEMPTS"
            echo "Retries: $((attempts - 1))"
            echo "Workflow remains GREEN."
            echo "The next scheduled run will try again."
            exit 0
          fi

          if [[ "$event" == OCI_ERROR\|* ]] && grep -qiE '429|TooManyRequests|too many requests|throttl' vm-result.txt; then
            echo "🟠 RATE LIMITED"
            echo "Attempts: $attempts/$MAX_ATTEMPTS"
            echo "Retries: $((attempts - 1))"
            echo "Cooldown was applied after the rate-limit response."
            echo "The next scheduled run will try again."
            exit 0
          fi

          echo "🔴 UNEXPECTED OCI ERROR"
          echo "Event: $event"
          exit "$rc"

      - name: Telegram Success Notification
        if: startsWith(steps.vm.outputs.event, 'SUCCESS|')
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ATTEMPTS: ${{ steps.vm.outputs.attempts }}
        run: |
          python - <<'PY'
          import os
          import urllib.parse
          import urllib.request

          text = (
              "🟢 Oracle VM launched successfully!\n\n"
              "VM: Tuhinpc-Final-VM\n"
              "Region: Singapore\n"
              "Shape: VM.Standard.A1.Flex\n"
              "OCPU: 1\n"
              "RAM: 1 GB\n"
              f"Attempts: {os.environ.get('ATTEMPTS', 'unknown')}\n"
              f"Retries: {max(int(os.environ.get('ATTEMPTS', '1')) - 1, 0)}"
          )

          url = (
              "https://api.telegram.org/bot"
              + os.environ["TELEGRAM_BOT_TOKEN"]
              + "/sendMessage"
          )

          data = urllib.parse.urlencode({
              "chat_id": os.environ["TELEGRAM_CHAT_ID"],
              "text": text
          }).encode()

          urllib.request.urlopen(
              urllib.request.Request(url, data=data),
              timeout=20
          ).read()
          PY
