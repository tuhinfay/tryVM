name: Oracle VM Auto Retry

on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 0,2,4,6,8,10,12,14,16 * * *"
    - cron: "0 18,19,20,21,22,23 * * *"

concurrency:
  group: oracle-vm-launch
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  launch:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install OCI SDK
        run: |
          python -m pip install --upgrade pip
          python -m pip install oci

      - name: Try Oracle VM
        id: vm
        env:
          OCI_REGION: ap-singapore-1
          OCI_TENANCY: ${{ secrets.OCI_TENANCY }}
          OCI_USER: ${{ secrets.OCI_USER }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
          OCI_SUBNET: ${{ secrets.OCI_SUBNET }}
          OCI_IMAGE: ${{ secrets.OCI_IMAGE }}
          OCI_SSH_KEY: ${{ secrets.OCI_SSH_KEY }}
          OCI_AD: FqdA:AP-SINGAPORE-1-AD-1
          VM_NAME: Tuhinpc-Final-VM
        shell: bash
        run: |
          set +e
          attempts=0
          event=""
          rc=3

          for i in $(seq 1 30); do
            attempts=$i
            echo ""
            echo "========================================"
            echo "Oracle VM Attempt $i/30"
            echo "========================================"

            python launch_vm.py > vm-result.txt 2>&1
            rc=$?
            cat vm-result.txt

            event=$(grep -E '^(SUCCESS|VM_EXISTS|CAPACITY_UNAVAILABLE|OCI_ERROR)' vm-result.txt | tail -1 || true)

            echo "Detected event: $event"
            echo "Exit code: $rc"

            if [ "$rc" -eq 0 ]; then
              break
            fi

            if [ "$event" = "CAPACITY_UNAVAILABLE" ]; then
              if [ "$i" -lt 30 ]; then
                echo "Waiting 60 seconds before attempt $((i + 1))..."
                sleep 60
              fi
              continue
            fi

            echo "Unexpected OCI error. Stopping retry loop."
            break
          done

          echo "event=$event" >> "$GITHUB_OUTPUT"
          echo "attempts=$attempts" >> "$GITHUB_OUTPUT"

          if [ "$event" = "CAPACITY_UNAVAILABLE" ]; then
            echo "No Oracle A1 Flex capacity found after $attempts attempts."
            exit 0
          fi

          if [[ "$event" == SUCCESS\|* ]]; then
            exit 0
          fi

          if [ "$event" = "VM_EXISTS" ]; then
            exit 0
          fi

          exit "$rc"

      - name: Telegram Success Notification
        if: startsWith(steps.vm.outputs.event, 'SUCCESS|')
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ATTEMPTS: ${{ steps.vm.outputs.attempts }}
        run: |
          python - <<'PY'
          import os, urllib.parse, urllib.request
          text = f"""🟢 Oracle VM launched successfully!

VM: Tuhinpc-Final-VM
Region: Singapore
Shape: VM.Standard.A1.Flex
OCPU: 1
RAM: 1 GB
Attempts: {os.environ.get("ATTEMPTS", "unknown")}"""
          url = "https://api.telegram.org/bot" + os.environ["TELEGRAM_BOT_TOKEN"] + "/sendMessage"
          data = urllib.parse.urlencode({"chat_id": os.environ["TELEGRAM_CHAT_ID"], "text": text}).encode()
          urllib.request.urlopen(urllib.request.Request(url, data=data), timeout=20).read()
          PY

      - name: Telegram OCI Error Notification
        if: startsWith(steps.vm.outputs.event, 'OCI_ERROR|')
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          VM_EVENT: ${{ steps.vm.outputs.event }}
          ATTEMPTS: ${{ steps.vm.outputs.attempts }}
        run: |
          python - <<'PY'
          import os, urllib.parse, urllib.request
          url = "https://api.telegram.org/bot" + os.environ["TELEGRAM_BOT_TOKEN"] + "/sendMessage"
          text = "🔴 Oracle VM launch error\n\n" + os.environ["VM_EVENT"] + "\nAttempts: " + os.environ.get("ATTEMPTS", "unknown")
          data = urllib.parse.urlencode({"chat_id": os.environ["TELEGRAM_CHAT_ID"], "text": text}).encode()
          urllib.request.urlopen(urllib.request.Request(url, data=data), timeout=20).read()
          PY
