name: Oracle VM Auto Retry

on:
  workflow_dispatch:
    inputs:
      manual_run:
        description: "Run Oracle VM capacity check now"
        required: false
        default: "yes"
  schedule:
    - cron: "*/5 * * * *"

concurrency:
  group: oracle-vm-launch
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  launch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip oci

      - name: Try VM launch with rapid retries
        id: vm
        env:
          OCI_REGION: ap-singapore-1
          OCI_TENANCY: ${{ secrets.OCI_TENANCY }}
          OCI_USER: ${{ secrets.OCI_USER }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
          OCI_SUBNET: ${{ secrets.OCI_SUBNET }}
          OCI_IMAGE: ${{ secrets.OCI_IMAGE }}
          OCI_SSH_KEY: ${{ secrets.OCI_SSH_KEY }}
          OCI_AD: FqdA:AP-SINGAPORE-1-AD-1
          VM_NAME: Tuhinpc-Final-VM
        run: |
          set +e
          attempts=0
          event=""
          rc=2

          for i in 1 2 3 4 5; do
            attempts=$i
            echo "===== Attempt $i/5 ====="
            python launch_vm.py | tee vm-result.txt
            rc=${PIPESTATUS[0]}
            event=$(grep -E '^(SUCCESS|VM_EXISTS|CAPACITY_UNAVAILABLE|OCI_ERROR)' vm-result.txt | tail -1 || true)

            if [ "$rc" -eq 0 ]; then
              break
            fi

            if [ "$rc" -eq 2 ] && [ "$event" = "CAPACITY_UNAVAILABLE" ]; then
              if [ "$i" -lt 5 ]; then
                echo "Capacity unavailable. Retrying in 45 seconds..."
                sleep 45
              fi
              continue
            fi

            break
          done

          echo "event=$event" >> "$GITHUB_OUTPUT"
          echo "attempts=$attempts" >> "$GITHUB_OUTPUT"

          if [ "$rc" -eq 2 ] && [ "$event" = "CAPACITY_UNAVAILABLE" ]; then
            echo "Oracle A1 Flex capacity unavailable after $attempts attempts. Next scheduled run will retry."
            exit 0
          fi

          exit "$rc"

      - name: Notify Telegram on successful launch
        if: always() && startsWith(steps.vm.outputs.event, 'SUCCESS|')
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ATTEMPTS: ${{ steps.vm.outputs.attempts }}
        run: |
          python - <<'PY'
          import os, urllib.parse, urllib.request
          text = f"""🟢 Oracle VM launched successfully!

VM: Tuhinpc-Final-VM
Region: Singapore
Shape: VM.Standard.A1.Flex
OCPU: 1
RAM: 1 GB
Attempts in this run: {os.environ.get("ATTEMPTS","unknown")}

GitHub Actions accepted the launch request."""
          url = "https://api.telegram.org/bot" + os.environ["TELEGRAM_BOT_TOKEN"] + "/sendMessage"
          data = urllib.parse.urlencode({"chat_id": os.environ["TELEGRAM_CHAT_ID"], "text": text}).encode()
          urllib.request.urlopen(urllib.request.Request(url, data=data), timeout=20).read()
          PY

      - name: Notify Telegram on unexpected OCI error
        if: always() && startsWith(steps.vm.outputs.event, 'OCI_ERROR|')
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          VM_EVENT: ${{ steps.vm.outputs.event }}
          ATTEMPTS: ${{ steps.vm.outputs.attempts }}
        run: |
          python - <<'PY'
          import os, urllib.parse, urllib.request
          url = "https://api.telegram.org/bot" + os.environ["TELEGRAM_BOT_TOKEN"] + "/sendMessage"
          text = "🔴 Oracle VM launch error\n\n" + os.environ["VM_EVENT"] + "\nAttempts: " + os.environ.get("ATTEMPTS","unknown")
          data = urllib.parse.urlencode({"chat_id": os.environ["TELEGRAM_CHAT_ID"], "text": text}).encode()
          urllib.request.urlopen(urllib.request.Request(url, data=data), timeout=20).read()
          PY
